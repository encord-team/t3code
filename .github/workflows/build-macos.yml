name: Build macOS app

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: macOS arm64
    runs-on: macos-15
    timeout-minutes: 60
    env:
      T3CODE_DESKTOP_UPDATE_REPOSITORY: encord-team/t3code
      T3CODE_DESKTOP_SIGNED: "false"
      RUSTUP_TOOLCHAIN: "1.95.0"
    steps:
      # Avoid checkout's submodule cleanup on the orphaned .repos gitlinks.
      - name: Checkout
        shell: bash
        env:
          CHECKOUT_REF: ${{ github.sha }}
          GIT_TERMINAL_PROMPT: "0"
        run: |
          set -euo pipefail
          git init .
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags --depth=1 origin "$CHECKOUT_REF"
          git sparse-checkout set --no-cone '/*' '!/.repos/'
          git checkout --detach FETCH_HEAD

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb # v1
        with:
          node-version-file: package.json
          cache: true
          run-install: false

      - name: Install dependencies
        run: vp i

      - name: Install native helper toolchain
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal

      - name: Configure public T3 Connect settings
        run: cp .env.example .env

      # Local distribution only: no signing credentials or publishing steps.
      - name: Build DMG and updater archive
        run: vp run dist:desktop:dmg --arch arm64

      - name: Upload downloadable artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: t3code-macos-arm64-${{ github.run_number }}
          path: |
            release/*.dmg
            release/*.zip
            release/*.yml
            release/*.blockmap
          if-no-files-found: error
          retention-days: 14
